dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    pseudotile = true # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # you probably want this
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
    mfact = 0.55;
    new_status = master
    new_on_top = true
    new_on_active = before
    always_keep_position = true
}

gestures {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    gesture = 3, horizontal, workspace,
#    workspace_swipe = on
#    workspace_swipe_fingers = 3
}

misc {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    force_default_wallpaper = 0 # Set to 0 to disable the anime mascot wallpapers
    animate_mouse_windowdragging = false
    animate_manual_resizes = false
    disable_hyprland_logo = true
    disable_splash_rendering = false
    vfr = true

}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#executing for more
# device:epic-mouse-v1 {
#     sensitivity = -0.5
# }



group {
    insert_after_current = true
    groupbar {
      render_titles = true
    }
}

# Example windowrule v1
# windowrule = float, ^(kitty)$
# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# windowrule = float, keepass 



# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, RETURN, exec, kitty
bind = SUPER_SHIFT, RETURN, exec, alacritty
bind = $mainMod, Q, killactive, 
bind = $mainMod SHIFT, W, exec, ~/.config/hypr/scripts/KillActiveProcess.sh # Kill active process
bind = $mainMod, F, exec, nautilus


# toggle waybar
bind = $mainMod, B, exec, ~/.config/hypr/scripts/toggle_waybar

# bind = SUPER_SHIFT, W, closewindow, 
bind = $mainMod ALT, Q, exit, 
# bind = SUPER_ALT, R, exec, ~/.config/scripts/waybar_start.sh 



#################################################################################################
# bind = SUPER_SHIFT, S, execr, grim -g "$(slurp)" - | wl-copy 
# bind = ,Print, execr, grim ~/Pictures/screenshots/$(date +"␍reenshot-%Y-%m-%d-%T.jpg")
#################################################################################################
# bind = SUPER_SHIFT, S, execr, grimblast --freeze copy area
bind = SUPER_SHIFT, S, exec, XDG_CURRENT_DESKTOP=sway flameshot gui
bind = , Print, execr, ~/.config/hypr/scripts/screenshot_save
bind = $mainMod, Print, execr, ~/.config/hypr/scripts/screenshot_save_whole
bind = , Print, exec,  sh -c 'REGION=$(slurp) || exit; grim -g "$REGION" - | wl-copy && notify-send "Grim Screenshot" "Screenshot of the region is copied into clipboard" -t 1000'

# bind = SUPER_SHIFT, S, exec, ~/.config/hypr/scripts/screenshot rc
# bind = SUPER, Print, exec, ~/.config/hypr/scripts/screenshot rf
# bind = CTRL, Print, exec, ~/.config/hypr/scripts/screenshot ri
# bind = SHIFT, Print, exec, ~/.config/hypr/scripts/screenshot sc
# bind = SUPER SHIFT, Print, exec, ~/.config/hypr/scripts/screenshot sf
# bind = CTRL SHIFT, Print, exec, ~/.config/hypr/scripts/screenshot si
# bind = ALT, Print, exec, ~/.config/hypr/scripts/screenshot p



# nightlight
bind = CTRL_SUPER, I, execr, ~/.config/hypr/scripts/toggle_hyprsunset


bind = $mainMod, D, togglefloating, 
bind = $mainMod, A, exec, rofi -show 
bind = $mainMod SHIFT, A, exec, rofi -show 
# bind = $mainMod, E, exec, rofi -modi "emoji:rofimoji" -show emoji
bind = $mainMod, E, exec, rofimoji
# bind = $mainMod, E, exec, wofi-emoji
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle
bind = $mainMod, F, fullscreen, # full screen
bind = $mainMod, M, fullscreen,1 # monocle


# Clipboard
bind = $mainMod, V, exec, $HOME/.config/hypr/scripts/show_clipboard

# bind = SUPER_ALT, M, execr, bash ~/some.sh

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1



# mouse whell to change the workspace
bind=SUPER,mouse_down,workspace,e-1


# to switch between windows in a floating workspace
bind = ALT, TAB,cyclenext,          # change focus to another window
bind = SUPER_SHIFT,C,cyclenext,prev          # change focus to another window
bind = $mainMod,C,bringactivetotop,   # bring it to the top

bind=SUPER,TAB,workspace,previous

# run custom script
bind = $mainMod, L, exec, bash $HOME/.config/hypr/scripts/lock.sh
bind = SUPER_SHIFT, L, exec, bash $HOME/.config/hypr/scripts/lock.sh && systemctl suspend
bind = SUPER_SHIFT, R, exec, feh ~/bachelors/7th-sem/time_table.png --fullscreen



################################
# AUDIO
################################
# increase volume
binde=, XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+

# decrease volume
binde=, XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-

# mute volume
binde=, XF86AudioMute, exec, pulsemixer --toggle-mute


# BRIGHTNESS
#
# increase brightness 
# binde=, XF86MonBrightnessUp, exec, brightnessctl set +5%
bind=, XF86MonBrightnessUp, exec, bash $HOME/.config/hypr/scripts/brightness-up

# decrease brightness 
# binde=, XF86MonBrightnessDown, exec, brightnessctl set 5%-
bind=, XF86MonBrightnessDown, exec, bash $HOME/.config/hypr/scripts/brightness-down



# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# workspace rules
workspace = 5, monitor:HDMI-A-1, default:true
workspace = 6, monitor:HDMI-A-1, default:true
workspace = 7, monitor:HDMI-A-1, default:true
workspace = 8, monitor:HDMI-A-1, default:true
workspace = 9, monitor:HDMI-A-1, default:true



